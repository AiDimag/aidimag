<svg xmlns="http://www.w3.org/2000/svg" width="920" height="860" viewBox="0 0 920 860" fill="none" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ptArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="ptArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#10b981"/>
    </marker>
    <marker id="ptArrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b5cf6"/>
    </marker>
    <marker id="ptArrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background — matches diagram-flow.svg / diagram-lifecycle.svg -->
  <rect x="0" y="0" width="920" height="860" rx="16" fill="#0f172a"/>
  <text x="460" y="36" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="800">Putting it together — the full flow</text>

  <!-- ============ Step 1: Capture (You / Agent + methods) ============ -->
  <g>
    <rect x="100" y="56" width="720" height="100" rx="14" fill="#172554" stroke="#2563eb" stroke-width="2"/>
    <text x="460" y="84" text-anchor="middle" fill="#bfdbfe" font-size="14" font-weight="800">1 · Capture — you or your AI agent writes down a claim</text>
    <text x="460" y="104" text-anchor="middle" fill="#60a5fa" font-size="11">e.g. "All database access goes through src/db/store.ts"</text>
    <!-- Capture methods row -->
    <rect x="130" y="114" width="135" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="197" y="129" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">dim remember</text>
    <text x="197" y="143" text-anchor="middle" fill="#64748b" font-size="9">write directly</text>
    <rect x="280" y="114" width="135" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="347" y="129" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">dim mine</text>
    <text x="347" y="143" text-anchor="middle" fill="#64748b" font-size="9">from commits &amp; PRs</text>
    <rect x="430" y="114" width="135" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="497" y="129" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">dim harvest</text>
    <text x="497" y="143" text-anchor="middle" fill="#64748b" font-size="9">from AI chat logs</text>
    <rect x="580" y="114" width="145" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="652" y="129" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">dim bootstrap</text>
    <text x="652" y="143" text-anchor="middle" fill="#64748b" font-size="9">auto-survey the repo</text>
  </g>

  <!-- Arrow: 1 -> 1b (review) -->
  <path d="M460 156v26" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ptArrow)"/>

  <!-- ============ Step 1b: Human Review Gate ============ -->
  <g>
    <rect x="230" y="182" width="460" height="56" rx="14" fill="#3b1d0e" stroke="#f59e0b" stroke-width="2"/>
    <text x="460" y="206" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="800">1b · Human review — nothing is stored without your approval</text>
    <text x="460" y="226" text-anchor="middle" fill="#fbbf24" font-size="11">dim review — you approve, edit, or reject each proposed memory</text>
  </g>

  <!-- Arrow: 1b -> 2 -->
  <path d="M460 238v30" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ptArrow)"/>

  <!-- ============ Step 2: Memory Store (left-center) ============ -->
  <g>
    <rect x="140" y="268" width="360" height="90" rx="14" fill="#111827" stroke="#0ea5e9" stroke-width="2"/>
    <text x="320" y="296" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="800">2 · Memory Store</text>
    <text x="320" y="316" text-anchor="middle" fill="#7dd3fc" font-size="12">Every claim lives here with its evidence</text>
    <text x="320" y="334" text-anchor="middle" fill="#7dd3fc" font-size="11">A local database inside your project</text>
    <text x="320" y="350" text-anchor="middle" fill="#0891b2" font-size="10">Stays on your machine — sync is optional</text>
  </g>

  <!-- ============ Step 5: Team Sync (right, same level as store) ============ -->
  <g>
    <rect x="560" y="268" width="300" height="90" rx="14" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Cloud icon -->
    <text x="600" y="320" text-anchor="middle" font-size="44" fill="#8b5cf6" opacity="0.7">☁</text>
    <text x="725" y="296" text-anchor="middle" fill="#ddd6fe" font-size="14" font-weight="800">5 · Team sync (optional)</text>
    <text x="710" y="318" text-anchor="middle" fill="#c4b5fd" font-size="12">Share memories with your team</text>
    <text x="710" y="336" text-anchor="middle" fill="#c4b5fd" font-size="11">via cloud.aidimag.com or self-hosted</text>
    <text x="710" y="352" text-anchor="middle" fill="#7c3aed" font-size="10">Everyone gets a shared brain</text>
  </g>

  <!-- Sync arrow: store -> team sync (horizontal, clean, no overlap) -->
  <path d="M500 313h50" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#ptArrowPurple)"/>
  <text x="525" y="305" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">dim sync</text>

  <!-- Arrow: 2 -> search split -->
  <path d="M320 358v34" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ptArrow)"/>
  <text x="330" y="378" fill="#94a3b8" font-size="11">Search with AI chat or agent</text>
  <text x="330" y="392" fill="#64748b" font-size="10">e.g. "How does auth work in this repo?"</text>

  <!-- ============ Search splits to 3a and 3b ============ -->
  <path d="M320 392v16" stroke="#94a3b8" stroke-width="2.5"/>
  <path d="M180 408h380" stroke="#94a3b8" stroke-width="2.5"/>
  <path d="M180 408v22" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ptArrow)"/>
  <path d="M560 408v22" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ptArrow)"/>

  <!-- ============ Step 3a: MCP Server (left) ============ -->
  <g>
    <rect x="40" y="430" width="280" height="100" rx="14" fill="#082f49" stroke="#06b6d4" stroke-width="2"/>
    <text x="180" y="458" text-anchor="middle" fill="#a5f3fc" font-size="14" font-weight="800">3a · Live connection to AI tools</text>
    <text x="180" y="478" text-anchor="middle" fill="#67e8f9" font-size="12">Claude Code, Cursor, Copilot</text>
    <text x="180" y="496" text-anchor="middle" fill="#67e8f9" font-size="11">search and read memories in real time</text>
    <text x="180" y="516" text-anchor="middle" fill="#0891b2" font-size="10" font-style="italic">via Model Context Protocol (MCP)</text>
  </g>

  <!-- ============ Step 3b: Generated Context Files (right) ============ -->
  <g>
    <rect x="420" y="430" width="280" height="100" rx="14" fill="#082f49" stroke="#06b6d4" stroke-width="2"/>
    <text x="560" y="458" text-anchor="middle" fill="#a5f3fc" font-size="14" font-weight="800">3b · Static context files</text>
    <text x="560" y="478" text-anchor="middle" fill="#67e8f9" font-size="12">CLAUDE.md, .cursorrules,</text>
    <text x="560" y="496" text-anchor="middle" fill="#67e8f9" font-size="12">copilot-instructions.md</text>
    <text x="560" y="516" text-anchor="middle" fill="#0891b2" font-size="10" font-style="italic">auto-generated for tools that read a file at startup</text>
  </g>

  <!-- Arrows: 3a -> 4 and 3b -> 4 -->
  <path d="M180 530v34" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ptArrow)"/>
  <path d="M560 530v34" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ptArrow)"/>

  <!-- ============ Step 4: Verification (full width, below 3a and 3b) ============ -->
  <g>
    <rect x="40" y="564" width="720" height="80" rx="14" fill="#052e2b" stroke="#10b981" stroke-width="2"/>
    <text x="400" y="592" text-anchor="middle" fill="#a7f3d0" font-size="14" font-weight="800">4 · Automatic verification — the key difference</text>
    <text x="400" y="612" text-anchor="middle" fill="#34d399" font-size="12">After every git pull, checkout, or rebase — aiDimag re-checks</text>
    <text x="400" y="630" text-anchor="middle" fill="#34d399" font-size="12">each memory's evidence against the current code</text>
  </g>

  <!-- ============ Verification loop: step 4 -> step 2 (left side) ============ -->
  <path d="M40 604 L 10 604 L 10 313 L 140 313" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ptArrowGreen)"/>
  <!-- Re-verify box sitting on the loop arrow, near box 2 -->
  <rect x="7" y="290" width="100" height="44" rx="8" fill="#052e2b" stroke="#10b981" stroke-width="1.5"/>
  <text x="57" y="306" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">Re-verify</text>
  <text x="57" y="318" text-anchor="middle" fill="#34d399" font-size="8">after every</text>
  <text x="57" y="328" text-anchor="middle" fill="#34d399" font-size="8">pull / push</text>

  <!-- ============ Step 6: Ticketing (right side, same level as 3a/3b) ============ -->
  <g>
    <rect x="770" y="430" width="130" height="100" rx="14" fill="#3b1d0e" stroke="#f59e0b" stroke-width="2"/>
    <text x="835" y="458" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="800">6 · Tickets</text>
    <text x="835" y="478" text-anchor="middle" fill="#fbbf24" font-size="10">Jira, GitHub,</text>
    <text x="835" y="492" text-anchor="middle" fill="#fbbf24" font-size="10">Linear, etc.</text>
    <text x="835" y="510" text-anchor="middle" fill="#92400e" font-size="9" font-style="italic">the "why" behind</text>
    <text x="835" y="522" text-anchor="middle" fill="#92400e" font-size="9" font-style="italic">each commit</text>
  </g>

  <!-- Arrow: ticketing -> 3b (feeding ticket context into generated files) -->
  <path d="M770 480c-30 0-50 10-70 10" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#ptArrowAmber)"/>
  <text x="735" y="452" text-anchor="middle" fill="#fbbf24" font-size="9">ticket context</text>
  <text x="735" y="464" text-anchor="middle" fill="#fbbf24" font-size="9">flows in</text>

  <!-- ============ Status legend with explanations ============ -->
  <rect x="40" y="664" width="840" height="140" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="460" y="686" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">After verification, each memory gets one of these statuses:</text>

  <!-- VERIFIED -->
  <rect x="60" y="696" width="125" height="56" rx="8" fill="#052e2b" stroke="#10b981" stroke-width="1.5"/>
  <text x="122" y="714" text-anchor="middle" fill="#34d399" font-size="10" font-weight="800">VERIFIED ✓</text>
  <text x="122" y="732" text-anchor="middle" fill="#34d399" font-size="9">Evidence still</text>
  <text x="122" y="744" text-anchor="middle" fill="#34d399" font-size="9">passes — ranked first</text>

  <!-- STALE -->
  <rect x="200" y="696" width="125" height="56" rx="8" fill="#3b1d0e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="262" y="714" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="800">STALE ⚠</text>
  <text x="262" y="732" text-anchor="middle" fill="#fbbf24" font-size="9">Code changed,</text>
  <text x="262" y="744" text-anchor="middle" fill="#fbbf24" font-size="9">evidence broken</text>

  <!-- UNVERIFIED -->
  <rect x="340" y="696" width="125" height="56" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="402" y="714" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="800">UNVERIFIED</text>
  <text x="402" y="732" text-anchor="middle" fill="#94a3b8" font-size="9">No evidence</text>
  <text x="402" y="744" text-anchor="middle" fill="#94a3b8" font-size="9">checked yet</text>

  <!-- REFUTED -->
  <rect x="480" y="696" width="125" height="56" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="542" y="714" text-anchor="middle" fill="#a1a1aa" font-size="10" font-weight="800">REFUTED ✗</text>
  <text x="542" y="732" text-anchor="middle" fill="#a1a1aa" font-size="9">Proven wrong —</text>
  <text x="542" y="744" text-anchor="middle" fill="#a1a1aa" font-size="9">kept as a warning</text>

  <!-- PINNED -->
  <rect x="620" y="696" width="125" height="56" rx="8" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="682" y="714" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="800">PINNED 📌</text>
  <text x="682" y="732" text-anchor="middle" fill="#38bdf8" font-size="9">Manually kept,</text>
  <text x="682" y="744" text-anchor="middle" fill="#38bdf8" font-size="9">never expires</text>

  <!-- DECAYED -->
  <rect x="760" y="696" width="105" height="56" rx="8" fill="#3b1d0e" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="812" y="714" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="800">DECAYED</text>
  <text x="812" y="732" text-anchor="middle" fill="#fbbf24" font-size="9">Confidence fades</text>
  <text x="812" y="744" text-anchor="middle" fill="#fbbf24" font-size="9">over time</text>

  <!-- Decay note -->
  <text x="460" y="828" text-anchor="middle" fill="#64748b" font-size="11">
    Memories with no evidence lose confidence over time and naturally decay — stale memories auto-draft replacement proposals for review
  </text>
</svg>
