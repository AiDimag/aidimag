name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: |
          echo "Package contents:"
          npm pack --dry-run
          echo ""
          echo "Checking for source files in package..."
          if npm pack --dry-run 2>&1 | grep -E "dist/.*\.(ts|tsx)$" | grep -v "\.d\.ts$"; then
            echo "ERROR: TypeScript source files found in package!"
            exit 1
          fi
          echo "✓ No source files found in package"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
